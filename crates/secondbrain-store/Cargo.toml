[package]
name = "secondbrain-store"
version = { workspace = true }
authors = { workspace = true }
description = "secondbrain — local SQLite store for captured segments, extractions, and notes"
repository = { workspace = true }
license = { workspace = true }
edition = { workspace = true }

[dependencies]
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "migrate", "macros", "chrono"] }
tokio = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "1"
tracing = { workspace = true }
dirs = "5"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }
